[project]
name = "timezone-mcp"
version = "0.1.0"
description = "MCP server for precise time zone conversion"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Oliver Steele", email = "steele@osteele.com" }]
dependencies = [
    "mcp>=1.7.1",
    "typing-extensions>=4.16.0",
    "tzdata>=2026.3",
]

[project.scripts]
timezone-mcp = "timezone_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timezone_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.4",
    "ty>=0.0.69",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
